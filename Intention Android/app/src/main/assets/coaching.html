<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intention: Let's check in</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="paywall.css">
  <style>
    @font-face { font-family: 'Arvo'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Arvo-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Arvo'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/Arvo-Bold.woff2') format('woff2'); }
    @font-face { font-family: 'Arvo'; font-style: italic; font-weight: 400; font-display: swap; src: url('fonts/Arvo-Italic.woff2') format('woff2'); }
    @font-face { font-family: 'Arvo'; font-style: italic; font-weight: 700; font-display: swap; src: url('fonts/Arvo-BoldItalic.woff2') format('woff2'); }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Arvo', Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    :root {
      --int-bar-height: 96px;
    }

    .int-column {
      max-width: 620px;
      margin: 0 auto;
      height: 100%;
      padding: 14vh 24px calc(var(--int-bar-height) + 24px);
      display: flex;
      flex-direction: column;
    }

    h1.int-heading {
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: normal;
      text-transform: none;
      color: var(--ink);
    }

    .int-stats-row {
      display: none;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 30px;
      font-size: 13px;
    }

    .int-stat {
      display: flex;
      gap: 5px;
    }

    .int-stat-value {
      color: var(--text-muted);
      font-weight: 600;
    }

    .int-stat-label {
      color: var(--text-dim);
    }

    .int-messages {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
    }

    .int-messages::-webkit-scrollbar { width: 6px; }
    .int-messages::-webkit-scrollbar-track { background: transparent; }
    .int-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .int-messages::-webkit-scrollbar-thumb:hover { background: var(--border-input); }

    .int-msg {
      font-size: 19px;
      line-height: 1.62;
      white-space: pre-wrap;
      animation: int-fade-in 0.45s ease-out;
    }

    .int-msg-assistant {
      color: var(--ink);
    }

    .int-msg-user {
      color: var(--text-muted);
    }

    .int-msg-user::before {
      content: "You: ";
      color: var(--text-dim);
    }

    .int-thinking {
      opacity: 0.5;
    }

    .int-bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: var(--paper);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .int-bottom-bar-inner {
      max-width: 620px;
      margin: 0 auto;
      padding: 12px 24px 16px;
      display: flex;
      flex-direction: column;
    }

    .int-composer {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-input);
      padding-bottom: 8px;
    }

    .int-composer input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
      outline: none;
      font-family: inherit;
      padding: 4px 0;
    }

    .int-composer input::placeholder {
      color: var(--text-dim);
    }

    .int-composer button {
      border: 1px solid var(--border-input);
      border-radius: var(--radius-card);
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      padding: 6px 14px;
    }

    .int-composer button:hover {
      color: var(--ink);
      background: var(--hover);
    }

    .int-close-row {
      margin-top: 10px;
    }

    button.int-secondary {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }

    button.int-secondary:hover {
      color: var(--text-muted);
      text-decoration: underline;
    }

    /* --primary-on, not --ink: this is text ON the accent, and --ink is the
       colour of the page it sits against — white on azure in dark mode, which
       is 3.8:1. */
    button.int-secondary.int-block {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-control);
      background: var(--primary-solid);
      color: var(--primary-on);
      font-size: 15px;
      text-align: center;
    }

    button.int-secondary.int-block:hover {
      background: var(--primary-solid-hover);
      border-color: var(--primary-solid-hover);
      text-decoration: none;
    }

    .int-retry-row {
      margin-top: 4px;
    }

    .int-retry-btn {
      border: 1px solid var(--border-input);
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      padding: 7px 14px;
      border-radius: var(--radius-card);
      cursor: pointer;
      font-family: inherit;
    }

    .int-retry-btn:hover {
      background: var(--hover);
    }

    /* System note: machinery speaking (a clamped grant, a cap hit), not the coach. */
    .int-msg.int-system {
      align-self: center;
      text-align: center;
      background: var(--success-fill);
      border: 1px solid var(--success-line);
      border-radius: var(--radius-card);
      color: var(--success-text);
      font-size: 13px;
      padding: 6px 12px;
    }

    /* Walk-away moment: one full-screen line before the page goes. */
    .int-walkaway {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 20px;
      color: var(--ink);
      background: var(--paper);
      font-family: inherit;
    }

    @keyframes int-fade-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Paywall (see billing.js renderPaywall) — shown in place of the chat when
       there's no AI access on this device. */
  </style>
</head>
<body>
  <div class="int-column">
    <h1 class="int-heading" id="int-heading">Why are you here?</h1>
    <div class="int-stats-row" id="int-stats-row"></div>
    <div class="int-messages" id="int-messages"></div>
    <div id="int-paywall" hidden></div>
  </div>

  <div class="int-bottom-bar" id="int-bottom-bar">
    <div class="int-bottom-bar-inner">
      <div class="int-composer">
        <input type="text" id="int-input" placeholder="Type your reply…" autocomplete="off">
        <button id="int-send">Send</button>
      </div>
      <div class="int-close-row">
        <button id="int-close" class="int-secondary">Close tab</button>
      </div>
    </div>
  </div>

  <script src="providers.js"></script>
  <script src="billing.js"></script>
  <script src="report.js"></script>
  <script src="gate-ui.js"></script>
  <script src="coaching.js"></script>
</body>
</html>
