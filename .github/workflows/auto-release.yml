name: Automated Release

# Every push to main cuts a release, which is right when main only moves for
# work that is ready to ship — and wrong when a batch of it lands at once and
# the release should wait. workflow_dispatch is the way to hold it: disable
# this workflow, push, then enable it and run it here when you actually want
# the version out. Without a manual trigger the only way back is another push
# to main, which means an empty commit for no reason but the trigger.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Automated Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify build and test
        run: |
          npm test

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
