name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A second push to a PR makes the first run's answer irrelevant, and the macOS
# leg is the expensive one to leave running for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # There is no bundler here: shared/ is a set of classic scripts loaded
      # into four separate global scopes, each loading a different subset. The
      # ESLint config derives each file's allowed globals from the shipped
      # manifests, so this is what catches a call into a file the manifest
      # does not load alongside you — a TypeError in the overlay otherwise.
      - name: Lint
        run: npm run lint

      # With coverage, and with a floor under it. The extension source is
      # evaluated in vm contexts rather than imported, so the numbers only
      # exist because tests/load.js gives each file its own file: URL — see
      # vitest.config.js for what is measured and why.
      - name: Unit tests
        run: npm run test:coverage

      # Kept for the run where the number matters: the HTML report says which
      # lines, which a percentage in a log does not.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Validate JSON manifests
        run: |
          for dir in "Intention Chrome" "Intention Firefox" "Intention Apple/Shared (Extension)/Resources"; do
            echo "Validating $dir/manifest.json..."
            jq empty "$dir/manifest.json"
          done

      - name: Verify version sync across platforms
        run: |
          CHROME_VERSION=$(jq -r .version "Intention Chrome/manifest.json")
          FIREFOX_VERSION=$(jq -r .version "Intention Firefox/manifest.json")
          echo "Chrome: $CHROME_VERSION | Firefox: $FIREFOX_VERSION"
          [[ "$CHROME_VERSION" == "$FIREFOX_VERSION" ]] || { echo "::error::Chrome/Firefox version mismatch"; exit 1; }

          PBXPROJ="Intention Apple/Intention Safari.xcodeproj/project.pbxproj"
          if [[ -f "$PBXPROJ" ]]; then
            APPLE_VERSIONS=$(grep -oE "MARKETING_VERSION = [0-9.]+;" "$PBXPROJ" | sed -E 's/MARKETING_VERSION = ([0-9.]+);/\1/' | sort -u)
            if [[ "$(echo "$APPLE_VERSIONS" | wc -l)" != "1" ]] || [[ "$APPLE_VERSIONS" != "$CHROME_VERSION" ]]; then
              echo "::error::Safari MARKETING_VERSION ($APPLE_VERSIONS) doesn't match manifest version ($CHROME_VERSION)"
              exit 1
            fi
          fi
          GRADLE="Intention Android/app/build.gradle.kts"
          if [[ -f "$GRADLE" ]]; then
            ANDROID_VERSION=$(grep -oE 'versionName = "[0-9.]+"' "$GRADLE" | sed -E 's/versionName = "([0-9.]+)"/\1/')
            if [[ "$ANDROID_VERSION" != "$CHROME_VERSION" ]]; then
              echo "::error::Android versionName ($ANDROID_VERSION) doesn't match manifest version ($CHROME_VERSION)"
              exit 1
            fi
          fi
          echo "✓ Versions in sync"

      - name: Check JS syntax
        run: |
          for dir in "Intention Chrome" "Intention Firefox"; do
            echo "Checking $dir JS files..."
            find "$dir/" -name '*.js' -exec node --check {} +
          done

      - name: Lint Firefox extension (AMO validation)
        run: npx web-ext lint --source-dir="Intention Firefox"

      # Every file the manifests actually load, in every platform directory —
      # read from the manifests rather than restated, so a script added to the
      # extension is checked here without editing this workflow.
      - name: Verify file structure
        run: node scripts/check-platform-files.mjs

      - name: Cross-platform sync check
        run: scripts/sync.sh --check

  # The only end-to-end coverage of the overlay, the setup wizard and colour
  # contrast — it drives a real Chromium with the extension loaded. It used to
  # exist and never run, which is the same as not existing.
  smoke:
    name: Smoke tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-artifacts
          path: |
            build/shots/**
            tests/smoke/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # ~2,700 lines of Kotlin, including Play Billing, used to be compiled for the
  # first time by the publish workflow — i.e. after the release was cut. It
  # still needs no secrets: the release build is signed with a throwaway key
  # made on the spot, because what matters here is that R8 (minify is on for
  # release) and the release variant build at all, not who signed them.
  android:
    name: Android compiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # build.gradle.kts reads the release signing config from these
      # ANDROID_KEY* variables when there is no keystore.properties — the same
      # path publish-android.yml uses with the real upload key.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-throwaway.jks" -storepass ci-throwaway \
            -alias ci -keypass ci-throwaway \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Intention CI"

      # Unit tests, then a debug build, then the release build: the last is
      # the only one that runs R8, so a missing keep rule (Play Billing and
      # org.json reflection are the usual casualties) fails here rather than
      # in a user's hands.
      - name: Unit tests, debug and release builds
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-throwaway.jks
          ANDROID_KEYSTORE_PASSWORD: ci-throwaway
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: ci-throwaway
        run: |
          cd "Intention Android"
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

  # ~2,500 lines of Swift, including StoreKit. Compile only: no signing, no
  # provisioning profile, no secrets — CODE_SIGNING_ALLOWED=NO is what makes
  # that possible on a runner with no certificates.
  apple:
    name: Apple compiles
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build macOS target
        run: |
          xcodebuild \
            -project "Intention Apple/Intention Safari.xcodeproj" \
            -scheme "Intention Safari (macOS)" \
            -configuration Debug \
            -derivedDataPath build/ci-macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      # The iOS app is where the Screen Time, Live Activity and StoreKit code
      # lives, none of which the macOS target compiles.
      - name: Build iOS target (simulator)
        run: |
          xcodebuild \
            -project "Intention Apple/Intention Safari.xcodeproj" \
            -scheme "Intention Safari (iOS)" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ci-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build
