name: Publish to App Store Connect

# Builds and uploads signed iOS/macOS binaries to App Store Connect for every
# release Automated Release cuts, provided the ASC_*/MATCH_* secrets are
# configured (see DEPLOYMENT.md). This only primes each build in App Store Connect — it does
# not attach it to a version or submit it for review; do that manually when
# ready. FAILS the run if the secrets are missing, so a release channel that
# is publishing nothing cannot keep reporting success — use the
# allow_missing_secrets input for a deliberate dry run. Runs on a macOS runner
# via Fastlane + match, the same setup used for local releases (see
# Intention Apple/fastlane/Fastfile).
#
# A manual run publishes an existing release tag, never a branch.

on:
  workflow_run:
    workflows: ["Automated Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        type: string
        required: true
      allow_missing_secrets:
        description: "Skip (rather than fail) when App Store Connect secrets are unset"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check a release happened
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which release is this?
        id: check
        uses: ./.github/actions/resolve-release
        with:
          tag: ${{ inputs.tag }}

  apple:
    name: Publish to App Store Connect (${{ matrix.platform.name }})
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            lane: ios beta
          - name: macOS
            lane: mac beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: Check secrets configured
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
        run: |
          MISSING=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT MATCH_PASSWORD MATCH_GIT_SSH_KEY; do
            [[ -n "${!name}" ]] || MISSING="$MISSING $name"
          done

          if [[ -z "$MISSING" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # A manual run may legitimately want to exercise the earlier steps
          # without secrets; a release run never does.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.allow_missing_secrets }}" == "true" ]]; then
            echo "::warning::Skipping publish, secrets not configured:$MISSING"
            exit 0
          fi

          # Failing here is the point. This job used to report success after
          # doing nothing, so a release channel that had never once published
          # looked identical to a healthy one. A red job is the signal.
          echo "::error::App Store Connect secrets not configured, so this release did NOT reach the App Store. Missing:$MISSING. See DEPLOYMENT.md."
          exit 1

      - name: Select Xcode
        if: steps.check.outputs.configured == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Load match-certs SSH key
        if: steps.check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY }}

      - name: Set up Ruby + Fastlane
        if: steps.check.outputs.configured == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          working-directory: Intention Apple

      - name: Build & upload to App Store Connect
        if: steps.check.outputs.configured == 'true'
        working-directory: Intention Apple
        run: bundle exec fastlane ${{ matrix.platform.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
