name: Publish to Google Play

# Publishes a Google Play internal release for every release Automated Release
# cuts, using the ANDROID_*/GOOGLE_PLAY_* secrets (see DEPLOYMENT.md). FAILS
# the run if those secrets are missing, so a release channel that is
# publishing nothing cannot keep reporting success — use the
# allow_missing_secrets input for a deliberate dry run.
#
# A manual run publishes an existing release tag, never a branch.

on:
  workflow_run:
    workflows: ["Automated Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        type: string
        required: true
      allow_missing_secrets:
        description: "Skip (rather than fail) when Google Play secrets are unset"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check a release happened
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which release is this?
        id: check
        uses: ./.github/actions/resolve-release
        with:
          tag: ${{ inputs.tag }}

  android:
    name: Publish to Google Play
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: Check secrets configured
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_MISSING: ${{ inputs.allow_missing_secrets }}
        run: |
          MISSING=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            [[ -n "${!name}" ]] || MISSING="$MISSING $name"
          done

          if [[ -z "$MISSING" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$ALLOW_MISSING" == "true" ]]; then
            echo "::warning::Skipping publish, secrets not configured:$MISSING"
            exit 0
          fi

          # Red, not a warning: a skipped publish that reports success looks
          # identical to a healthy release channel.
          echo "::error::Google Play secrets not configured, so ${{ needs.check-release.outputs.tag }} did NOT reach Google Play. Missing:$MISSING. See DEPLOYMENT.md."
          exit 1

      - name: Set up JDK
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        if: steps.check.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload-keystore.jks

      - name: Build signed release bundle
        if: steps.check.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: /tmp/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "Intention Android"
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload & publish to Google Play
        if: steps.check.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.co.maybeitssoftware.intention
          releaseFiles: Intention Android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # Commit the internal release without sending it for review. Play
          # refuses to auto-submit while any review on the app is open (e.g. a
          # rejection), and an internal build doesn't need one anyway; send
          # changes for review from the Play console when a review is wanted.
          changesNotSentForReview: true
