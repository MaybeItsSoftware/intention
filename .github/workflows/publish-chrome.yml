name: Publish to Chrome Web Store

# Uploads a draft build to the Chrome Web Store for every release Automated
# Release cuts, using the CHROME_* secrets (see DEPLOYMENT.md). This only
# primes the new version in the dashboard — it does not submit it for review;
# do that manually when ready. FAILS the run if the secrets are missing, so a
# release channel that is publishing nothing cannot keep reporting success —
# use the allow_missing_secrets input for a deliberate dry run.
#
# A manual run publishes an existing release tag, never a branch.

on:
  workflow_run:
    workflows: ["Automated Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        type: string
        required: true
      allow_missing_secrets:
        description: "Skip (rather than fail) when Chrome Web Store secrets are unset"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check a release happened
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Which release is this?
        id: check
        uses: ./.github/actions/resolve-release
        with:
          tag: ${{ inputs.tag }}

  chrome:
    name: Publish to Chrome Web Store
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}
          persist-credentials: false

      - name: Check secrets configured
        id: check
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_MISSING: ${{ inputs.allow_missing_secrets }}
        run: |
          MISSING=""
          for name in CHROME_EXTENSION_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
            [[ -n "${!name}" ]] || MISSING="$MISSING $name"
          done

          if [[ -z "$MISSING" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$ALLOW_MISSING" == "true" ]]; then
            echo "::warning::Skipping publish, secrets not configured:$MISSING"
            exit 0
          fi

          # Red, not a warning: a skipped publish that reports success looks
          # identical to a healthy release channel.
          echo "::error::Chrome Web Store secrets not configured, so ${{ needs.check-release.outputs.tag }} did NOT reach the Chrome Web Store. Missing:$MISSING. See DEPLOYMENT.md."
          exit 1

      - name: Zip Chrome extension
        if: steps.check.outputs.configured == 'true'
        run: (cd "Intention Chrome" && zip -r -q "../intention-chrome.zip" . -x "env.txt" "*.DS_Store")

      - name: Upload to Chrome Web Store (draft only, not submitted for review)
        if: steps.check.outputs.configured == 'true'
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: intention-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: false
