name: Tramline · Android

# Triggered by Tramline. Builds a signed release .aab at Tramline's commit with
# Tramline's versionCode / versionName and uploads it as a single workflow
# artifact. Tramline uploads that artifact to Google Play itself, so this
# workflow needs no Play credentials. Signing uses the same `release`
# environment secrets as publish-android.yml.

on:
  workflow_dispatch:
    inputs:
      tramline-input:
        description: "JSON from Tramline (version_name, version_code, commit_ref, build_notes)"
        required: false
        default: "{}"

permissions:
  contents: read

concurrency:
  group: tramline-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Configure Tramline
        id: tramline
        uses: tramlinehq/deploy-action@v0.1.7
        with:
          input: ${{ github.event.inputs.tramline-input }}

      - name: Require Tramline version
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No version_name/version_code in tramline-input — this workflow is meant to be triggered by Tramline."; exit 1
          fi

      # A release bundle without a signing key would come out unsigned rather
      # than fail, so refuse to build at all without the upload key.
      - name: Check signing secrets configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || MISSING="$MISSING $name"
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::Android signing secrets not configured. Missing:$MISSING. See DEPLOYMENT.md."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed release bundle
        working-directory: Intention Android
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify bundle is signed
        run: |
          AAB="Intention Android/app/build/outputs/bundle/release/app-release.aab"
          keytool -printcert -jarfile "$AAB" | grep -q "Owner:" || { echo "::error::$AAB is not signed"; exit 1; }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: intention-android-${{ steps.tramline.outputs.version_name }}-${{ steps.tramline.outputs.version_code }}
          path: Intention Android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
